[package]
name = "tsuji-kernels"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Tsuji's CPU geometry kernels, built to WebAssembly for the geometry worker."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
